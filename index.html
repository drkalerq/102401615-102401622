<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/core.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">寻</span><span>校园失物招领</span></div>
      <h1>让失物更快<br>回到主人身边</h1>
      <p>集中发布 · 快速查找 · 温暖归还</p>
    </header>
    <main id="main-content" tabindex="-1">
      <p id="storage-warning" class="notice error-notice" role="alert" hidden></p>
      <p id="feedback" class="notice success-notice" role="status" hidden></p>
      <section id="home-page" class="page" aria-labelledby="home-title">
        <button class="search-entry" type="button" data-page="search"><span aria-hidden="true">⌕</span>搜索物品名称、地点…<span class="search-label">搜索</span></button>
        <div class="section-heading"><h2 id="home-title">校园最新信息</h2><span id="result-count" aria-live="polite"></span></div>
        <div class="filters" role="group" aria-label="信息类型筛选">
          <button type="button" class="filter active" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="filter" data-filter="lost" aria-pressed="false">寻物</button>
          <button type="button" class="filter" data-filter="found" aria-pressed="false">招领</button>
        </div>
        <div id="home-list" class="item-list"></div>
        <p class="demo-note">初始 5 条为虚构演示信息；新增信息保存在当前浏览器。</p>
      </section>
      <section id="search-page" class="page" aria-labelledby="search-title" hidden>
        <h2 id="search-title">搜索物品</h2><div class="placeholder"><span aria-hidden="true">⌕</span><h3>搜索页面已就位</h3><p>下一阶段接入关键词与分类搜索。</p><button type="button" class="primary-button" data-page="home">返回首页</button></div>
      </section>
      <section id="publish-page" class="page" aria-labelledby="publish-title" hidden>
        <h2 id="publish-title">发布信息</h2>
        <p class="form-intro">带 * 的内容为必填，清晰的描述有助于找回物品。</p>
        <form id="publish-form" class="publish-form" novalidate>
          <fieldset class="type-field"><legend>信息类型 *</legend>
            <label><input type="radio" name="type" value="lost" checked> 我要寻物</label>
            <label><input type="radio" name="type" value="found"> 我要招领</label>
          </fieldset>
          <div class="field"><label for="f-title">物品名称 *</label><input id="f-title" name="title" maxlength="40" placeholder="如：黑色雨伞" required><p id="error-title" class="field-error" hidden></p></div>
          <div class="field"><label for="f-category">物品类别 *</label><select id="f-category" name="category"><option>证件</option><option>电子用品</option><option>生活用品</option><option>书籍文具</option><option>其他</option></select></div>
          <div class="field"><label for="f-place">丢失／捡到地点 *</label><input id="f-place" name="place" maxlength="80" placeholder="如：图书馆三楼" required><p id="error-place" class="field-error" hidden></p></div>
          <div class="field"><label for="f-eventTime">丢失／捡到时间</label><input id="f-eventTime" name="eventTime" type="datetime-local"><p class="field-hint">不填则使用发布时刻。</p><p id="error-eventTime" class="field-error" hidden></p></div>
          <div class="field"><label for="f-description">详细描述</label><textarea id="f-description" name="description" rows="4" maxlength="500" placeholder="物品的颜色、外观和特征（最多 500 字）"></textarea><p id="error-description" class="field-error" hidden></p></div>
          <div class="field"><label for="f-contact">联系方式 *</label><input id="f-contact" name="contact" maxlength="100" placeholder="微信号或手机号" required><p class="field-hint">联系方式将展示在详情中，请勿填写密码等敏感内容。</p><p id="error-contact" class="field-error" hidden></p></div>
          <p id="publish-error" class="notice error-notice" role="alert" hidden></p>
          <button id="publish-submit" class="primary-button submit-button" type="submit">发布信息</button>
        </form>
      </section>
      <section id="mine-page" class="page" aria-labelledby="mine-title" hidden>
        <h2 id="mine-title">我的发布</h2><div class="placeholder"><span aria-hidden="true">◇</span><h3>在这里管理你的信息</h3><p>后续接入编辑、删除及已找回／已归还状态。</p><button type="button" class="primary-button" data-page="home">返回首页</button></div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="主要导航">
      <button type="button" class="nav-item active" data-page="home" aria-current="page"><span aria-hidden="true">⌂</span>首页</button>
      <button type="button" class="nav-item" data-page="search"><span aria-hidden="true">⌕</span>搜索</button>
      <button type="button" class="nav-item" data-page="publish"><span class="nav-plus" aria-hidden="true">＋</span>发布</button>
      <button type="button" class="nav-item" data-page="mine"><span aria-hidden="true">◇</span>我的</button>
    </nav>
  </div>
</body>
</html>
