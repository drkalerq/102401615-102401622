<!DOCTYPE html>

<title>校园失物招领 · 我的发布</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; background:#e9edf3; display:flex; justify-content:center; padding:24px; }
  .frame { width:390px; height:844px; background:#F2F4F7; border:3px solid #CBD2DC; border-radius:40px; position:relative; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.12); }
  .notch { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:96px; height:22px; background:#1F2937; border-radius:11px; z-index:50; }
  .profile { position:absolute; top:0; left:0; right:0; padding:46px 18px 18px; background:#2D6CDF; color:#fff; display:flex; gap:14px; align-items:center; }
  .avatar { width:56px; height:56px; border-radius:50%; background:#fff; color:#2D6CDF; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
  .content { position:absolute; top:130px; left:16px; right:16px; bottom:54px; overflow-y:auto; }
  .stats { display:flex; gap:10px; margin:12px 0; }
  .stat { flex:1; background:#fff; border:1px solid #E2E8F0; border-radius:12px; text-align:center; padding:10px; }
  .stat .n { font-size:22px; font-weight:700; color:#2D6CDF; } .stat .n.g { color:#1A9E5F; } .stat .n.gr { color:#9AA5B1; }
  .stat .l { font-size:12px; color:#6B7280; }
  .card { background:#fff; border:1px solid #E2E8F0; border-radius:12px; padding:12px; display:flex; gap:12px; margin-bottom:12px; align-items:center; }
  .thumb { width:56px; height:56px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; font-size:24px; background:#EAF0FB; }
  .thumb.green { background:#E6F7EE; }
  .c-title { font-size:15px; font-weight:600; color:#1F2937; } .c-sub { font-size:11px; color:#9AA5B1; margin-top:6px; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:9px; }
  .tag.lost { background:#FFF1F0; color:#E03131; } .tag.found { background:#F6FFED; color:#1A9E5F; }
  .op { font-size:12px; margin-top:6px; }
  .nav { position:absolute; bottom:0; left:0; right:0; height:54px; background:#fff; border-top:1px solid #E2E8F0; display:flex; align-items:center; }
  .nav a { flex:1; text-align:center; font-size:12px; color:#9AA5B1; text-decoration:none; }
  .nav a.on { color:#2D6CDF; font-weight:600; }
  .nav .plus { flex:none; width:40px; height:40px; background:#2D6CDF; color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 8px; text-decoration:none; }
</style>
</head>

    </div>

        <div class="stat"><div class="n gr">0</div><div class="l">招领中</div></div>

      <div class="card">

</html>
